          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        views:
          type: integer
        likes:
          type: integer
        comments:
          type: integer
        duration:
          type: ["integer", "null"]
        publishedAt:
          type: ["string", "null"]
        contentId:
          type: ["integer", "null"]
