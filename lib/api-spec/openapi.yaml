      type: object
      properties:
        id:
          type: integer
        keyword:
          type: string
        volume:
          type: integer
        competition:
          type: string
        cpc:
          type: number
        trend:
          type: number
        tracked:
          type: boolean
        createdAt:
          type: string
      required: [id, keyword, volume, competition, cpc, trend, tracked, createdAt]

    KeywordInput:
      type: object
      properties:
        keyword:
          type: string
          minLength: 1
      required: [keyword]

