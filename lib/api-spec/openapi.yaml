    # ── YOUTUBE STUDIO SCHEMAS ──
    ChannelInfo:
      type: object
      properties:
        id:
          type: integer
        channelName:
          type: string
        channelId:
          type: ["string", "null"]
        subscribers:
          type: integer
        totalViews:
          type: integer
        totalVideos:
          type: integer
        healthScore:
          type: integer
        monthlyRevenue:
          type: number
        avgViewDuration:
          type: number
        clickThroughRate:
          type: number
        updatedAt:
          type: string
      required: [id, channelName, subscribers, totalViews, totalVideos, healthScore, monthlyRevenue, avgViewDuration, clickThroughRate, updatedAt]

    AnalyticsOverview:
      type: object
      properties:
        period:
          type: string
        views:
          type: integer
        watchTime:
          type: number
        subscribers:
          type: integer
        revenue:
          type: number
        impressions:
          type: integer
        ctr:
          type: number
        avgViewDuration:
          type: number
        topVideos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        dailyStats:
          type: array
          items:
            $ref: "#/components/schemas/DailyStat"
      required: [period, views, watchTime, subscribers, revenue, impressions, ctr, avgViewDuration, topVideos, dailyStats]

    DailyStat:
      type: object
      properties:
        date:
          type: string
        views:
          type: integer
        watchTime:
          type: number
        revenue:
          type: number
        subscribers:
          type: integer
      required: [date, views, watchTime, revenue, subscribers]

    Competitor:
      type: object
      properties:
        id:
          type: integer
        channelName:
          type: string
        channelUrl:
          type: ["string", "null"]
        subscribers:
          type: integer
        totalVideos:
          type: integer
        avgViews:
          type: integer
        uploadFrequency:
          type: ["string", "null"]
        niche:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, channelName, subscribers, totalVideos, avgViews, createdAt]

    CompetitorInput:
      type: object
      properties:
        channelName:
          type: string
          minLength: 2
        channelUrl:
          type: ["string", "null"]
        niche:
          type: ["string", "null"]
      required: [channelName]

